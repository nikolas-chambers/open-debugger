name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VERSION: 1.0.0

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # Recursive, but the private plugin submodule is registered update = none,
      # so git skips it here and the build simply leaves those plugins out.
      - name: Check out submodules (private ones auto-skip)
        run: git submodule update --init --recursive

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Stage artifacts
        shell: pwsh
        run: |
          $name = "open-debugger-$env:VERSION-${{ matrix.arch }}-${{ matrix.config }}"
          $bin  = "build/${{ matrix.config }}"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item "$bin/odbg.exe","$bin/odbg_cli.exe" $name
          Copy-Item "$bin/*.dll" $name -ErrorAction SilentlyContinue
          if (Test-Path "$bin/plugins") { Copy-Item "$bin/plugins" "$name/plugins" -Recurse }
          "STAGE=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: ${{ env.STAGE }}

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path "$env:STAGE/*" -DestinationPath "$env:STAGE.zip"

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.STAGE }}.zip
